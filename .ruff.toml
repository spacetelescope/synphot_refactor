exclude = [
    "docs",
    ".tox",
    ".eggs",
    "build",
    "__init__.py",
]
line-length = 125

target-version = "py311"

[format]
quote-style = "double"
indent-style = "space"

[lint]
# Ignoring these for now:
# B006: Do not use mutable data structures for argument defaults
# RUF012: Mutable default value for class attribute
ignore = [
    "B006",
    "RUF012",
]

[lint.isort]
known-first-party = ["synphot"]
